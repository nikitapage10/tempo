name: CI

# PR-blocking gates from AR-1 (TEMPO Activation/Reliability/Pulse program):
# lint, type-check/build, unit tests, migration order check, and a bounded
# E2E smoke suite. Every job that talks to Supabase uses the isolated
# TEST_SUPABASE_* secrets below — never the production project. See
# test/support/test-env-guard.ts, which independently refuses to run if
# these ever pointed at production.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   TEST_SUPABASE_URL              - the isolated test project's URL
#   TEST_SUPABASE_ANON_KEY         - its anon/publishable key
#   TEST_SUPABASE_SERVICE_ROLE_KEY - its service_role/secret key

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-desktop-release.mjs

  migration-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-migration-order.mjs

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write isolated test env
        run: |
          cat > .env.test.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          EOF
      - name: Seed deterministic fixtures
        run: node test/support/seed-fixtures.mjs
      - run: npm test

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [lint-and-build, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Write isolated test env
        run: |
          cat > .env.test.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          EOF
      - name: Seed deterministic fixtures
        run: node test/support/seed-fixtures.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
